name: Update price data

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 pm IST, Mon-Fri (after NSE close)
  workflow_dispatch:           # manual run from the Actions tab or the dashboard button
    inputs:
      refresh_list:
        description: "Rebuild the stock list from NSE (otherwise only prices update)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
        env:
          REFRESH_LIST: ${{ github.event.inputs.refresh_list || 'false' }}
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/data.json
          if [ -f universe.json ]; then git add universe.json; fi
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)

